images:

# ------------------------
# PYTHON
# ------------------------

  - id: python-official
    language: Python
    registry: docker
    image: python

    variants:
      production:
        - slim-bookworm
        - slim

      development:
        - bookworm
        - latest

    supports:
      enterprise: false
      security: medium
      shell: true
      native_dependencies: true
      fips: false

    orchestrators:
      - Docker
      - Kubernetes

    strengths:
      - Official Docker image
      - Stable Debian base
      - Large community

  - id: python-chainguard

    language: Python

    registry: chainguard

    image: python

    variants:
      production:
        - latest

    supports:
      enterprise: false
      security: very_high
      shell: false
      native_dependencies: false
      fips: false

    orchestrators:
      - Kubernetes

    strengths:
      - Minimal attack surface
      - Low CVEs
      - Secure by default

  - id: python-ubi

    language: Python

    registry: redhat

    image: ubi9/python-312

    variants:
      production:
        - minimal

    supports:
      enterprise: true
      security: high
      shell: true
      native_dependencies: true
      fips: true

    orchestrators:
      - Kubernetes
      - OpenShift

    strengths:
      - Enterprise support
      - Long lifecycle
      - FIPS capable

# ------------------------
